<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h2>Simple Registration Form</h2>

    <form onsubmit="event.preventDefault(); alert('Registration Successful!\n\nName: ' + document.getElementById('name').value + '\nEmail: ' + document.getElementById('email').value + '\nPhone: ' + document.getElementById('phone').value);">
        
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" placeholder="Enter your phone number" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" placeholder="Enter your password" required><br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
