<!DOCTYPE html>
<html>
<body>
    <script>
        let basic = Number(prompt("Enter the Salary :"));
        let hra = basic*(0.05);
        let da = basic*(0.05);
        let ta = basic*(0.05);
        let ded = basic*(0.03);
        let net = hra + da + ta - ded;
        document.write("Net Salary \n:" + net);

    </script>
    
</body>
</html>
