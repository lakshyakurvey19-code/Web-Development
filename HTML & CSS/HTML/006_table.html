<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
        }

        th {
            background-color: #dbeafe;
            color: #1e3a8a;
        }

        td {
            background-color: #f8fafc;
        }

        th, td {
            border: 1px solid #94a3b8;
            padding: 10px;
            text-align: center;
        }

        h2 {
            color: #334155;
        }
    </style>
</head>

<body>

    <h1 align="center">Student Details</h1>

    <table border="1" align="center">
        <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Semester</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Lakshya Kurvey</td>
            <td>IT</td>
            <td>3rd</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Shraddha Srivastava</td>
            <td>CSE</td>
            <td>3rd</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Lakshya Rathi</td>
            <td>Civil</td>
            <td>3rd</td>
        </tr>
        <tr>
            <td>104</td>
            <td>Bhavna Sahu</td>
            <td>DS</td>
            <td>3rd</td>
        </tr>
    </table>

</body>
</html>
